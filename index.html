<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASA MIA Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#06233f;
color:white;
}

header{
padding:25px;
background:#04182c;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:bold;
color:#d4a64a;
}

.container{
padding:40px;
max-width:1200px;
margin:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
color:#10233d;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.card h3{
margin:0;
color:#06233f;
}

.number{
font-size:36px;
font-weight:bold;
margin-top:15px;
color:#d4a64a;
}

.table{
margin-top:40px;
background:white;
color:#10233d;
border-radius:20px;
overflow:hidden;
}

.table h2{
padding:25px;
margin:0;
background:#f5f5f5;
}

.row{
display:grid;
grid-template-columns:1fr 1fr 1fr 1fr;
padding:18px 25px;
border-top:1px solid #eee;
}

.row.header{
font-weight:bold;
background:#fafafa;
}

.badge{
background:#d4a64a;
color:#06233f;
padding:6px 10px;
border-radius:999px;
font-weight:bold;
font-size:13px;
}

</style>
</head>

<body>

<div id="loginScreen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#04182c;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
">

<div style="
background:white;
padding:40px;
border-radius:20px;
width:320px;
text-align:center;
">

<h2 style="color:#06233f;">Login Admin</h2>

<input
id="passwordInput"
type="password"
placeholder="Password admin"
style="
width:100%;
padding:15px;
margin-top:20px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
"
/>

<button
onclick="loginAdmin()"
style="
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#06233f;
color:white;
font-size:16px;
cursor:pointer;
">
Accedi
</button>

<p id="loginError" style="color:red;margin-top:10px;"></p>

</div>

</div>

<header>
<div class="logo">CASA MIA Admin</div>
<div>Dashboard gestione lavori</div>
</header>

<div class="container">

<h1>Dashboard Admin Live</h1>
<p>Dati collegati al database Supabase.</p>

<div class="cards">

<div class="card">
<h3>Lead clienti</h3>
<div class="number" id="leadsCount">0</div>
</div>

<div class="card">
<h3>Imprese</h3>
<div class="number" id="companiesCount">0</div>
</div>

<div class="card">
<h3>Lavori aperti</h3>
<div class="number" id="jobsCount">0</div>
</div>

<div class="card">
<h3>Match creati</h3>
<div class="number" id="matchesCount">0</div>
</div>

</div>

<div class="table">

<h2>Ultimi lavori</h2>

<div class="row header">
<div>Cliente</div>
<div>Città</div>
<div>Servizio</div>
<div>Stato</div>
</div>

<div id="jobsTable"></div>

</div>

</div>

<script>

const SUPABASE_URL = "https://qoynblmqhmtdazuhdygv.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFveW5ibG1xaG10ZGF6dWhkeWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4OTYzODAsImV4cCI6MjA5NDQ3MjM4MH0.o4e9Kzoez_EMyDm0iIqiC45L3jXsPdCuh83PmAcnwyI";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

async function countTable(table, elementId){

const { count } = await db
.from(table)
.select("*", { count: "exact", head: true });

document.getElementById(elementId).innerText =
count || 0;

}

async function loadDashboard(){

await countTable("leads", "leadsCount");

await countTable("companies", "companiesCount");

await countTable("jobs", "jobsCount");

await countTable("matches", "matchesCount");

const { data } = await db
.from("jobs")
.select("*")
.order("created_at", { ascending:false })
.limit(10);

const table =
document.getElementById("jobsTable");

table.innerHTML = "";

if(!data || data.length === 0){

table.innerHTML = `
<div class="row">
<div>Nessun lavoro</div>
<div>-</div>
<div>-</div>
<div><span class="badge">Vuoto</span></div>
</div>
`;

return;

}

data.forEach(job => {

table.innerHTML += `
<div class="row">
<div>${job.customer_name || "-"}</div>
<div>${job.city || "-"}</div>
<div>${job.service_required || "-"}</div>
<div><span class="badge">${job.status || "new"}</span></div>
</div>
`;

});

}

function loginAdmin(){

const password =
document.getElementById("passwordInput").value;

if(password === "casamia2026"){

document.getElementById("loginScreen").style.display =
"none";

}else{

document.getElementById("loginError").innerText =
"Password errata";

}

}

loadDashboard();

</script>

</body>
</html>
